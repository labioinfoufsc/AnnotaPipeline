[workspace]
name = "annotapipeline"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
nextflow = "==25.10.4"
openjdk = "21.*"
python = "3.12.*"
biopython = "==1.85"
pandas = "==2.2.3"
pyyaml = "==6.0.2"
typer = "==0.29.2"

[tasks]
test = "python -m unittest discover -s tests -v"
lint = "ruff check scripts tests"
format = "ruff format --check scripts tests"

[feature.dev.dependencies]
ruff = "*"

[environments]
default = { features = ["dev"] }
